plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.datapros.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.datapros.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    // Build for both arm64 (modern phones) and x86_64 (emulator)
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "x86_64"
            universalApk true   // also produce a fat APK
        }
    }

    signingConfigs {
        release {
            storeFile file(MYAPP_UPLOAD_STORE_FILE)
            storePassword MYAPP_UPLOAD_STORE_PASSWORD
            keyAlias MYAPP_UPLOAD_KEY_ALIAS
            keyPassword MYAPP_UPLOAD_KEY_PASSWORD
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

chaquopy {
    defaultConfig {
        version = "3.11"
        buildPython("C:/Users/USER/AppData/Local/Programs/Python/Python311/python.exe")

        pip {
            install "pandas==1.5.0"
            install "numpy==1.26.2"
            install "openpyxl==3.1.2"
            install "xlsxwriter==3.2.0"
            install "matplotlib==3.6.0"
            install "Pillow==9.2.0"
            install "python-dateutil==2.9.0"
        }
    }
}

dependencies {
    // AndroidX core
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.7'

    // ViewModel / LiveData
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.2'

    // RecyclerView + CardView
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Billing/subscription network + custom tab checkout
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.browser:browser:1.8.0'

    // MPAndroidChart - native charts
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // OCR for image-to-table ingestion in SOD CR module
    implementation 'com.google.mlkit:text-recognition:16.0.0'

    // Chaquopy runtime (auto-added by plugin, listed for clarity)
    // com.chaquo.python:gradle is added at project level

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
