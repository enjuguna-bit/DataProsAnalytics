plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

def releaseStoreFile = (project.findProperty("MYAPP_UPLOAD_STORE_FILE") ?: "").toString()
def releaseKeyAlias = (project.findProperty("MYAPP_UPLOAD_KEY_ALIAS") ?: "").toString()
def releaseStorePassword = (project.findProperty("MYAPP_UPLOAD_STORE_PASSWORD") ?: "").toString()
def releaseKeyPassword = (project.findProperty("MYAPP_UPLOAD_KEY_PASSWORD") ?: "").toString()
def buildPythonPath = (
    project.findProperty("DATAPROS_BUILD_PYTHON")
        ?: System.getenv("DATAPROS_BUILD_PYTHON")
        ?: ""
).toString()
def offlineGuideSourceFile = rootProject.file("DataPros_User_Guide.docx")
def offlineGuideAssetDir = "$buildDir/generated/offlineGuideAssets"
def offlineGuideTextFileName = "DataPros_User_Guide.txt"
def releaseSigningConfigured =
        releaseStoreFile && releaseKeyAlias && releaseStorePassword && releaseKeyPassword

android {
    namespace 'com.datapros.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.datapros.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "BILLING_BASE_URL", "\"${System.getenv('BILLING_BASE_URL') ?: 'https://bulksms-webhook.enjuguna794.workers.dev'}\""

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    // Build for both arm64 (modern phones) and x86_64 (emulator)
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "x86_64"
            universalApk true   // also produce a fat APK
        }
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    sourceSets {
        main {
            assets.srcDir offlineGuideAssetDir
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

def extractGuideText = { File sourceFile ->
    String documentXml = null
    def zip = new java.util.zip.ZipFile(sourceFile)
    try {
        def entry = zip.getEntry("word/document.xml")
        if (entry != null) {
            zip.getInputStream(entry).withCloseable { input ->
                documentXml = input.getText("UTF-8")
            }
        }
    } finally {
        zip.close()
    }

    if (!documentXml) {
        throw new GradleException("word/document.xml was not found in ${sourceFile}")
    }

    return documentXml
        .replaceAll("(?i)<w:tab[^>]*/>", "\t")
        .replaceAll("(?i)<w:(br|cr)[^>]*/>", "\n")
        .replaceAll("(?i)</w:tc>", "\t")
        .replaceAll("(?i)</w:tr>", "\n")
        .replaceAll("(?i)</w:p>", "\n\n")
        .replaceAll("(?s)<[^>]+>", "")
        .replace('\u00A0' as char, ' ' as char)
        .replace('\u000B' as char, '\n' as char)
        .replace("&gt;", ">")
        .replace("&lt;", "<")
        .replace("&amp;", "&")
        .replace("&quot;", "\"")
        .replace("&apos;", "'")
        .replaceAll("\\n{3,}", "\n\n")
        .trim()
}

tasks.register("syncOfflineGuide") {
    inputs.file(offlineGuideSourceFile)
    outputs.dir(offlineGuideAssetDir)

    doFirst {
        if (!offlineGuideSourceFile.exists()) {
            throw new GradleException("Offline guide not found at ${offlineGuideSourceFile}")
        }
    }

    doLast {
        def outputDir = file(offlineGuideAssetDir)
        outputDir.mkdirs()

        copy {
            from(offlineGuideSourceFile)
            into(outputDir)
        }

        def textFile = new File(outputDir, offlineGuideTextFileName)
        textFile.setText(extractGuideText(offlineGuideSourceFile), "UTF-8")
    }
}

tasks.named("preBuild").configure {
    dependsOn(tasks.named("syncOfflineGuide"))
}

chaquopy {
    defaultConfig {
        version = "3.11"
        if (buildPythonPath) {
            buildPython(buildPythonPath)
        } else {
            buildPython("python")
        }

        pip {
            install "pandas==1.5.0"
            install "numpy==1.26.2"
            install "openpyxl==3.1.2"
            install "xlsxwriter==3.2.0"
            install "matplotlib==3.6.0"
            install "Pillow==9.2.0"
            install "python-dateutil==2.9.0"
        }
    }
}

dependencies {
    // AndroidX core
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.7'

    // ViewModel / LiveData
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.2'

    // RecyclerView + CardView
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Billing/subscription network + custom tab checkout
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.browser:browser:1.8.0'

    // MPAndroidChart - native charts
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // OCR for image-to-table ingestion in SOD CR module
    implementation 'com.google.mlkit:text-recognition:16.0.0'

    // Chaquopy runtime (auto-added by plugin, listed for clarity)
    // com.chaquo.python:gradle is added at project level

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
